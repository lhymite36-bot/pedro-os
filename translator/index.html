<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedro OS - Live Translate</title><meta name="theme-color" content="#0b0d10"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>.c,.panel,button{transition:all .2s ease;backdrop-filter:blur(12px)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:#0b0d10;color:#e8ecf5}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
header a{color:#9aa6c2;text-decoration:none}h1{font-size:1.1rem;margin:0;color:#f2f4f7;font-weight:600;letter-spacing:-.02em}
main{max-width:820px;margin:auto;padding:14px}
.modes{display:flex;gap:8px}.modes button{flex:1;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#e8ecf5;font-size:1rem}
.modes button.on{background:#8b8cf0;color:#0b0d10;font-weight:700;border-color:#8b8cf0}
.panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin-top:12px;min-height:110px}
.lbl{font-size:.75rem;letter-spacing:.1em;color:#7c87a6;text-transform:uppercase}
#src{font-size:1.4rem;color:#b8c2dc;margin-top:6px}#src i{color:#6f7a99}
#dst{font-size:2rem;font-weight:600;margin-top:6px;line-height:1.3}
#mic{width:100%;padding:22px;font-size:1.4rem;font-weight:700;border:0;border-radius:20px;margin-top:14px;background:#8b8cf0;color:#0b0d10}
#mic.live{background:#2a2b3a;color:#e8e8ff;animation:p 1.4s infinite}@keyframes p{50%{box-shadow:0 0 0 10px #2a2b3a;color:#e8e8ff33}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.row button,.row label{padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#e8ecf5;font-size:.95rem}
#status{color:#7c87a6;font-size:.85rem;margin-top:8px;min-height:1.2em}
#hist .it{border-top:1px solid rgba(255,255,255,.08);padding:10px 0}#hist .s{color:#9aa6c2}#hist .t{font-size:1.15rem}
details{margin-top:12px;color:#9aa6c2}input{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#0b0d10;color:#e8ecf5;margin-top:6px}
</style></head><body>
<header><a href="../">← Pedro OS</a><h1>Live Translate</h1><span></span></header>
<main>
<div class="modes"><button id="m1" class="on">Hindi → English</button><button id="m2">English → Hindi</button></div>
<div class="panel"><div class="lbl" id="sl">Hindi (heard)</div><div id="src"><i>Tap Start and let them speak…</i></div></div>
<div class="panel"><div class="lbl" id="tl">English</div><div id="dst"></div></div>
<button id="mic">🎙️ Start</button><div id="status"></div>
<div class="row"><label><input type="checkbox" id="speak" checked style="width:auto"> 🔊 Speak aloud</label><button id="copy">Copy</button><button id="exp">Export</button><button id="clr">Clear</button></div>
<details><summary>Better translation (optional Gemini key)</summary><input id="key" placeholder="Paste Gemini API key — saved only on this device"><small>Leave empty to use free translation. Key stays in localStorage.</small></details>
<div class="panel"><div class="lbl">Conversation history</div><div id="hist"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);let mode='hi',rec,listening=false,hist=JSON.parse(localStorage.hist||'[]'),deb,lastInterim='';
const cfg=()=>mode==='hi'?{from:'hi',to:'en',rl:'hi-IN',vl:'en-IN'}:{from:'en',to:'hi',rl:'en-IN',vl:'hi-IN'};
$('key').value=localStorage.gkey||'';$('key').oninput=e=>localStorage.gkey=e.target.value.trim();
$('speak').checked=localStorage.speak!=='0';$('speak').onchange=e=>localStorage.speak=e.target.checked?'1':'0';
function setMode(m){mode=m;$('m1').classList.toggle('on',m==='hi');$('m2').classList.toggle('on',m==='en');$('sl').textContent=m==='hi'?'Hindi (heard)':'English (you)';$('tl').textContent=m==='hi'?'English':'Hindi';if(listening){stop();start()}}
$('m1').onclick=()=>setMode('hi');$('m2').onclick=()=>setMode('en');
async function gemini(t,c){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+encodeURIComponent(localStorage.gkey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Translate this ${c.from==='hi'?'Hindi':'English'} speech to natural ${c.to==='en'?'English':'Hindi'}. Output only the translation.\n\n${t}`}]}]})});const j=await r.json();return j.candidates[0].content.parts[0].text.trim()}
async function gtx(t,c){const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${c.from}&tl=${c.to}&dt=t&q=${encodeURIComponent(t)}`);if(!r.ok)throw 0;const j=await r.json();return j[0].map(x=>x[0]).join('')}
async function mym(t,c){const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t.slice(0,480))}&langpair=${c.from}|${c.to}`);const j=await r.json();return j.responseData.translatedText}
async function translate(t){const c=cfg();if(localStorage.gkey){try{return await gemini(t,c)}catch(e){}}try{return await gtx(t,c)}catch(e){}return await mym(t,c)}
function say(t){if(!$('speak').checked||!speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang=cfg().vl;u.rate=1.05;speechSynthesis.speak(u)}
function render(){$('hist').innerHTML=hist.slice().reverse().map(h=>`<div class="it"><div class="s">${esc(h.s)}</div><div class="t">${esc(h.t)}</div></div>`).join('');localStorage.hist=JSON.stringify(hist.slice(-300))}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));render();
function start(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='Speech recognition not supported. Use Chrome on Android or PC.';return}
rec=new SR();rec.lang=cfg().rl;rec.continuous=true;rec.interimResults=true;
rec.onresult=e=>{let fin='',int='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else int+=r[0].transcript}
if(int){$('src').innerHTML=esc(int)+' <i>…</i>';clearTimeout(deb);deb=setTimeout(async()=>{if(int===lastInterim)return;lastInterim=int;try{$('dst').textContent=await translate(int)}catch(e){}},600)}
if(fin.trim()){clearTimeout(deb);const s=fin.trim();$('src').textContent=s;translate(s).then(t=>{$('dst').textContent=t;hist.push({s,t,m:mode,at:new Date().toISOString()});render();say(t)}).catch(()=>$('status').textContent='Translation failed — check internet.')}};
rec.onerror=e=>{$('status').textContent=e.error==='not-allowed'?'Microphone blocked — allow mic access in browser settings.':'Mic: '+e.error};
rec.onend=()=>{if(listening)setTimeout(()=>{try{rec.start()}catch(e){}},250)};
try{rec.start()}catch(e){}listening=true;$('mic').textContent='⏹ Stop';$('mic').classList.add('live');$('status').textContent='Listening…'}
function stop(){listening=false;rec&&rec.stop();$('mic').textContent='🎙️ Start';$('mic').classList.remove('live');$('status').textContent='Stopped.'}
$('mic').onclick=()=>listening?stop():start();
const txt=()=>hist.map(h=>`[${h.at}] ${h.s}\n→ ${h.t}`).join('\n\n');
$('copy').onclick=()=>navigator.clipboard.writeText(txt()).then(()=>$('status').textContent='Copied!');
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt()],{type:'text/plain'}));a.download='translations.txt';a.click()};
$('clr').onclick=()=>{if(confirm('Clear history?')){hist=[];render()}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
